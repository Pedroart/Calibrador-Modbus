<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Calibrador</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons (opcional) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <!-- BOTÓN SIEMPRE VISIBLE -->
        <button
          class="btn btn-outline-light"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#sidebar"
        >
          <i class="bi bi-list"></i>
        </button>

        <img
          src="Logo Friomamut Horizontal Negativo.png"
          alt="FRIOMAMUT"
          class="navbar-brand mx-auto d-block"
          style="height: 80px"
        />

        <div class="d-flex">
          <button
            class="btn btn-outline-light"
            id="btn-refresh"
            type="button"
            title="Refrescar datos"
          >
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
      </div>
    </nav>

    <!-- SIDEBAR (OFFCANVAS) -->
    <div
      class="offcanvas offcanvas-start page-sidebar"
      tabindex="-1"
      id="sidebar"
    >
      <div class="offcanvas-header">
        <h5 class="offcanvas-title text-white">Ambientes</h5>
        <button
          type="button"
          class="btn-close text-white"
          data-bs-dismiss="offcanvas"
        ></button>
      </div>

      <div class="offcanvas-body p-0">
        <ul class="list-group list-group-flush" id="list-group">
          <li class="list-group-item list-item-dark">Tunel 1</li>
        </ul>
      </div>
    </div>

    <!-- CONTENIDO -->
    <main class="container-lg" style="padding-top: 120px">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div class="btn-group" role="group" aria-label="Vista">
          <button class="btn btn-primary active" type="button" id="btn-view-cards">
            <i class="bi bi-grid-3x3-gap"></i>
          </button>
          <button class="btn btn-outline-light" type="button" id="btn-view-table">
            <i class="bi bi-table"></i>
          </button>
        </div>

        <button class="btn btn-outline-light" type="button" id="btn-export-calibrations">
          <i class="bi bi-download"></i>
        </button>
      </div>

      <div
        class="row row-cols-1 row-cols-sm-2 row-cols-md-4 pb-5 row-gutter-5"
        id="cards-sensores"
      ></div>

      <div class="table-responsive calibration-table-wrap d-none" id="calibration-table-wrap">
        <table class="table table-dark table-hover align-middle calibration-table">
          <thead>
            <tr>
              <th>Sensor</th>
              <th>Valor actual</th>
              <th>Estado</th>
              <th>Offset pasado</th>
              <th>Offset aplicado</th>
              <th>Antes</th>
              <th>Despues</th>
            </tr>
          </thead>
          <tbody id="calibration-table-body"></tbody>
        </table>
      </div>
    </main>

      <!-- PRELOADER FULLSCREEN -->
      <div id="preloader" class="preloader">
        <div class="preloader-content">
          <div class="spinner-border text-light" role="status"></div>
          <div class="mt-3 text-light fw-semibold">Cargando…</div>
        </div>
      </div>

    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script src="refresh_controller.js"></script>
  </body>
</html>
